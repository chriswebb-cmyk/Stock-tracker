name = "stock-tracker-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[triggers]
# Two cron schedules:
#  - Sundays 06:00 UTC (≈02:00 ET): full ML retrain + cache the 7d backtest.
#  - Weekdays 22:00 UTC (≈18:00 ET, ~2h after market close): refresh the 1d
#    backtest cache so the dashboard's '1d' tab can serve from cache without
#    blowing the free-tier CPU budget on every page load.
crons = ["0 6 * * SUN", "0 22 * * 1-5"]

[[d1_databases]]
binding = "DB"
database_name = "stock-tracker"
# Same id as in workers/ingest/wrangler.toml.
database_id = "aa7f811d-46b5-4d1f-b2b8-f6fc5b0b43d6"

[vars]
# In dev keep '*'; tighten to your Netlify domain on deploy.
ALLOWED_ORIGINS = "*"
# Public URL of the reddit scraper worker. The /reddit/scrape endpoint
# proxies to this so the dashboard can trigger a scrape without dealing
# with cross-worker CORS.
REDDIT_WORKER_URL = "https://stock-tracker-reddit.chris-stocks.workers.dev"
