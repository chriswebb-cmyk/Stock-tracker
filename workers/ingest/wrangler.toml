name = "stock-tracker-ingest"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Cron runs every minute. The worker no-ops outside US market hours so we
# don't burn through free-tier invocations on weekends/overnight.
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "stock-tracker"
# Replace with the id printed by `wrangler d1 create stock-tracker`.
database_id = "aa7f811d-46b5-4d1f-b2b8-f6fc5b0b43d6"

[vars]
FINNHUB_REQUESTS_PER_MINUTE = "60"
# Min meta-ensemble probability for a signal to ping Discord. With Platt
# calibration in place these are real win-rate probabilities. 0.62 means
# we only alert on signals the model thinks have a 62%+ chance of winning.
ML_DISCORD_THRESHOLD = "0.62"
# Comma-separated list of setups whose signals are dropped before reaching
# Discord. Updated after multi-horizon training; refreshed weekly based on
# the most recent /ml/train run. Current underperformers:
#   orb_breakout_long      — chronic overfit (train >> val)
#   rsi_oversold_reversal  — val below baseline two runs in a row
#   vwap_reclaim_long      — no edge
#   vwap_reject_short      — regressed to val < baseline this run
DISABLED_SETUPS = "orb_breakout_long,rsi_oversold_reversal,vwap_reclaim_long,vwap_reject_short"
# Which hold-period model to consult at inference time. The trainer
# produces models at multiple horizons; this picks the one used to gate
# Discord alerts. 30 is the safest default for options swing trades.
TARGET_HOLD_MINUTES = "30"
# Watchlist split across N cron buckets. Higher = smaller per-invocation load
# but lower per-symbol refresh cadence. With 45 tickers and CHUNKS=2 each
# symbol refreshes every ~2 minutes. The Yahoo retry+host-rotation logic
# combined with Finnhub fallback keeps wall-clock under the 30s cron limit
# at this density.
CHUNKS = "2"

# Secrets are set with `wrangler secret put FINNHUB_API_KEY` — never in
# this file.
