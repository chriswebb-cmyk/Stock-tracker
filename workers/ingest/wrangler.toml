name = "stock-tracker-ingest"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Cron runs every minute. The worker no-ops outside US market hours so we
# don't burn through free-tier invocations on weekends/overnight.
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "stock-tracker"
# Replace with the id printed by `wrangler d1 create stock-tracker`.
database_id = "aa7f811d-46b5-4d1f-b2b8-f6fc5b0b43d6"

[vars]
FINNHUB_REQUESTS_PER_MINUTE = "60"
# Min ML probability for a signal to ping Discord. Bumped from 0.60 -> 0.65
# now that Platt calibration is in place — these are real win-rate
# probabilities, so fewer-but-higher-conviction alerts.
ML_DISCORD_THRESHOLD = "0.65"
# Comma-separated list of setups whose signals are dropped before reaching
# Discord. Based on the most recent /ml/train run:
#   orb_breakout_long      — train 72% / val 36%, severely overfit
#   rsi_oversold_reversal  — val 58% but baseline 60%, worse than majority
#   vwap_reclaim_long      — val ≈ baseline, no edge
DISABLED_SETUPS = "orb_breakout_long,rsi_oversold_reversal,vwap_reclaim_long"
# Watchlist split across N cron buckets. Higher = smaller per-invocation load
# but lower per-symbol refresh cadence. With 45 tickers and CHUNKS=2 each
# symbol refreshes every ~2 minutes. The Yahoo retry+host-rotation logic
# combined with Finnhub fallback keeps wall-clock under the 30s cron limit
# at this density.
CHUNKS = "2"

# Secrets are set with `wrangler secret put FINNHUB_API_KEY` — never in
# this file.
